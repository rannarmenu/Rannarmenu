<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#28543f" />
  <title>অফলাইনে আছেন — Rannar Menu</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f7f2;color:#26362a}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,440px);text-align:center;padding:36px 26px;background:#fffef9;border:1px solid #e5e7dd;border-radius:24px;box-shadow:0 20px 60px #26362a12}
    img{width:78px;height:78px;display:block;margin:0 auto 22px}
    h1{font-size:clamp(25px,6vw,32px);line-height:1.25;margin:0 0 12px}
    p{font-size:16px;line-height:1.8;color:#6c7569;margin:0 0 24px}
    button{font:inherit;font-weight:650;background:#28543f;color:#fff;border:0;border-radius:10px;padding:13px 20px;cursor:pointer}
    button:focus-visible{outline:3px solid #9bbda1;outline-offset:3px}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;background:#111712;color:#e8efe6}main{background:#19221a;border-color:#344136}p{color:#a5b1a4}}
  </style>
</head>
<body>
  <main>
    <img src="./rannar-menu-logo.svg" alt="Rannar Menu" />
    <h1>আপনি এখন অফলাইনে আছেন</h1>
    <p>Rannar Menu খুলতে ইন্টারনেট সংযোগটি চালু করে আবার চেষ্টা করুন। অ্যাপের কিছু অংশ আগে থেকে ক্যাশ করা থাকলেও লাইভ রেসিপি ও সার্চের জন্য ইন্টারনেট প্রয়োজন।</p>
    <button type="button" onclick="location.reload()">আবার চেষ্টা করুন</button>
  </main>
</body>
</html>
