<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4eb">
<meta name="description" content="Rannar Menu Chef Challenge — বাংলায় উপকরণ বেছে নিন, রান্নার সঠিক ধাপ সাজান, স্কোর বাড়ান এবং নিজের রান্নার দক্ষতা পরীক্ষা করুন।">
<title>Chef Challenge — Rannar Menu</title>
<style>
:root{color-scheme:light;--paper:#f7f4eb;--card:#fffdf8;--ink:#23392b;--muted:#758173;--green:#315c43;--green2:#477553;--line:#e4e6da;--gold:#d9aa54;--soft:#edf2e8;--shadow:0 18px 48px rgba(39,61,43,.08)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper);scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","SolaimanLipi",system-ui,sans-serif;background:radial-gradient(ellipse at 4% 0%,#e9efdf 0,transparent 32%),radial-gradient(ellipse at 100% 15%,#f4e9d2 0,transparent 28%),var(--paper)}
button,a{-webkit-tap-highlight-color:transparent}
button,a:focus-visible{outline:3px solid #d3ae62;outline-offset:3px}
button{font:inherit;cursor:pointer}
a{color:inherit}
.page-shell{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:20px 0 36px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:#fff8e9;background:var(--green);box-shadow:0 7px 18px #315c4326;flex:0 0 auto}
.brand-mark svg{width:26px;height:26px}
.brand-copy{display:flex;flex-direction:column;gap:1px;line-height:1.2}
.brand-copy strong{font-size:17px;font-weight:800;letter-spacing:-.2px}
.brand-copy small{font-family:ui-sans-serif,system-ui,sans-serif;font-size:9px;letter-spacing:1.6px;color:var(--muted);font-weight:800}
.top-actions{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,248,.78);color:var(--green);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill:hover{background:#eef3e8;border-color:#cbd8c8}
.top-score{color:var(--green);font-weight:800;font-size:13px}
main{min-height:60vh}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:30px;align-items:center;padding:clamp(24px,5vw,56px);overflow:hidden;border:1px solid #e4e6d9;border-radius:30px;background:linear-gradient(115deg,rgba(255,253,247,.96),rgba(250,249,239,.83));box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:330px;height:330px;right:-95px;top:-110px;border:1px solid #dfe7d8;border-radius:50%;box-shadow:0 0 0 36px #e8eddf70,0 0 0 76px #e8eddf43;pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:15px;color:var(--green2);font:800 10px/1.4 ui-sans-serif,system-ui,sans-serif;letter-spacing:1.6px}
.eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px #d9aa542b}
.hero h1{max-width:600px;margin:0;color:#20392a;font-size:clamp(36px,5.1vw,63px);line-height:1.1;letter-spacing:-1.1px}
.hero h1 em{color:var(--green2);font-style:normal}
.hero p{max-width:510px;margin:18px 0 22px;color:#6d796a;font-size:15px;line-height:1.9}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.primary-btn,.secondary-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:11px 18px;border:1px solid transparent;border-radius:12px;font-size:13px;font-weight:800;text-decoration:none;transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
.primary-btn{background:var(--green);color:white;box-shadow:0 8px 17px #315c4327}
.primary-btn:hover{background:#254d35;transform:translateY(-1px);box-shadow:0 11px 22px #315c4333}
.secondary-btn{background:var(--card);border-color:var(--line);color:var(--green)}
.secondary-btn:hover{background:var(--soft)}
.primary-btn svg,.secondary-btn svg{width:17px;height:17px}
.hero-art{position:relative;display:grid;place-items:center;min-height:280px;isolation:isolate}
.art-orbit{position:absolute;width:min(100%,320px);aspect-ratio:1;border:1px solid #dbe5d6;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fffefa 0,#f0f4e9 60%,#e8efdf 100%);box-shadow:inset 0 0 0 16px #ffffff63,0 14px 40px #344b3510;z-index:-1}
.pot{position:relative;display:grid;place-items:center;width:194px;height:171px;border-radius:25px 25px 55px 55px;background:linear-gradient(145deg,#44734f,#254b34);box-shadow:inset 0 6px 0 #67916b,0 23px 28px #315c4328;transform:rotate(-5deg)}
.pot:before{content:"";position:absolute;left:-22px;right:-22px;top:24px;height:20px;border-radius:50%;background:#315c43;border:5px solid #709875;box-shadow:0 5px 0 #23452e}
.pot:after{content:"";position:absolute;top:69px;left:24px;width:146px;height:9px;border-radius:8px;background:#fff4dc;opacity:.24}
.pot-face{font-size:66px;filter:drop-shadow(0 7px 5px #14291a20);transform:translateY(10px)}
.steam{position:absolute;top:17px;display:flex;gap:18px}
.steam i{display:block;width:12px;height:48px;border:3px solid #b3bf9f;border-bottom-color:transparent;border-left-color:transparent;border-radius:50%;transform:rotate(-16deg);opacity:.8;animation:floatSteam 2.3s ease-in-out infinite}
.steam i:nth-child(2){height:38px;animation-delay:.4s}
.steam i:nth-child(3){height:45px;animation-delay:.8s}
.art-label{position:absolute;right:0;bottom:20px;display:flex;align-items:center;gap:9px;padding:11px 13px;border:1px solid #e1e7d9;border-radius:13px;background:#fffdf5;box-shadow:0 9px 22px #2d4c3012;font-size:11px;font-weight:700}
.art-label b{font-size:20px}
.hero-mini-stats{display:flex;flex-wrap:wrap;gap:20px;margin-top:27px;padding-top:20px;border-top:1px solid var(--line)}
.hero-mini-stats span{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:10px}
.hero-mini-stats strong{color:var(--ink);font-size:15px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:32px 0 16px}
.section-head h2{margin:0;font-size:clamp(22px,3vw,31px);letter-spacing:-.4px}
.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.7}
.recipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.recipe-card{position:relative;display:flex;flex-direction:column;min-width:0;padding:13px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 7px 22px #243d2a07;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.recipe-card:hover{transform:translateY(-3px);box-shadow:0 15px 28px #243d2a10;border-color:#cedbc9}
.recipe-art{position:relative;display:grid;place-items:center;min-height:148px;overflow:hidden;border-radius:13px;background:linear-gradient(145deg,#e6efdb,#f3e8cb)}
.recipe-art:before{content:"";position:absolute;width:138px;height:138px;border:1px solid #ffffffa8;border-radius:50%;box-shadow:0 0 0 20px #ffffff50,0 0 0 40px #ffffff24}
.recipe-art .dish{position:relative;z-index:1;display:grid;place-items:center;width:94px;height:94px;border:7px solid #fffdf4;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff8e5,#f2dcae);box-shadow:0 12px 20px #394c301b;font-size:51px}
.recipe-card:nth-child(2) .recipe-art{background:linear-gradient(145deg,#f2dfcf,#f8ecdb)}
.recipe-card:nth-child(2) .recipe-art .dish{background:radial-gradient(circle at 36% 30%,#fff7e3,#ebbc94)}
.recipe-card:nth-child(3) .recipe-art{background:linear-gradient(145deg,#e0eedc,#f1f1ce)}
.recipe-card:nth-child(3) .recipe-art .dish{background:radial-gradient(circle at 36% 30%,#fffbe8,#d8e8b8)}
.recipe-chip{position:absolute;top:10px;left:10px;padding:5px 8px;border-radius:6px;background:#fffdf0df;color:var(--green);font-size:9px;font-weight:800}
.recipe-content{display:flex;flex:1;flex-direction:column;padding:13px 4px 4px}
.recipe-content h3{margin:0;color:var(--ink);font-size:19px;line-height:1.4}
.recipe-content p{min-height:42px;margin:7px 0 13px;color:var(--muted);font-size:11px;line-height:1.8}
.recipe-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.recipe-meta span{display:inline-flex;align-items:center;gap:5px;padding:5px 7px;border-radius:7px;background:#f2f3e9;color:#64745f;font-size:10px}
.recipe-meta span b{font-size:12px}
.recipe-content .primary-btn{width:100%;margin-top:auto;min-height:42px;padding:9px 12px}
.game-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(255px,.7fr);gap:18px;align-items:start}
.play-panel,.kitchen-panel{border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:var(--shadow)}
.play-panel{min-width:0;padding:clamp(18px,3vw,30px)}
.kitchen-panel{padding:20px}
.play-topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.stage-kicker{display:block;margin-bottom:5px;color:var(--green2);font:800 10px/1.4 ui-sans-serif,system-ui,sans-serif;letter-spacing:1.3px}
.play-topline h1{margin:0;font-size:clamp(24px,3.3vw,35px);line-height:1.25}
.play-topline p{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.8}
.timer-box{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;padding:10px 12px;border:1px solid #e3e6d9;border-radius:13px;background:#f6f6ee}
.timer-box span{color:var(--muted);font-size:9px;font-weight:700}
.timer-box strong{color:var(--green);font:800 20px/1.1 ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.timer-box.urgent{border-color:#f0c8b9;background:#fff0ea}
.timer-box.urgent strong{color:#b34a35}
.timer-track{height:6px;overflow:hidden;margin:-6px 0 22px;border-radius:999px;background:#e7eadf}
.timer-track span{display:block;width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#79a37c,#315c43);transition:width .25s linear}
.stage-track{display:flex;gap:7px;margin-bottom:23px}
.stage-track span{flex:1;height:5px;border-radius:99px;background:#e7eadf}
.stage-track span.active,.stage-track span.done{background:#5b8a60}
.ingredient-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:18px 0}
.ingredient{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:105px;padding:12px 7px;border:1px solid var(--line);border-radius:13px;background:#fffefa;color:var(--ink);transition:border-color .16s ease,background .16s ease,transform .16s ease}
.ingredient:hover{transform:translateY(-1px);border-color:#aabfa8}
.ingredient[aria-pressed="true"]{border-color:#477c4e;background:#edf5e9;box-shadow:inset 0 0 0 1px #477c4e}
.ingredient .food-emoji{font-size:29px;line-height:1}
.ingredient strong{font-size:12px}
.ingredient small{color:var(--muted);font-size:9px}
.ingredient .checkmark{position:absolute;top:6px;right:7px;display:none;color:#2c6a3d;font-size:13px;font-weight:900}
.ingredient[aria-pressed="true"] .checkmark{display:block}
.action-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:21px}
.selection-count{color:var(--muted);font-size:11px}
.feedback{min-height:46px;margin-top:14px;padding:12px 13px;border:1px solid #e5e8dc;border-radius:11px;background:#f7f7f0;color:#63735f;font-size:11px;line-height:1.7}
.feedback.success{border-color:#c8dfc6;background:#eef7eb;color:#2f6b3c}
.feedback.error{border-color:#f0d2c7;background:#fff3ef;color:#9e4a36}
.feedback:empty{display:none}
.step-card{padding:20px;border:1px solid #e3e7dc;border-radius:16px;background:linear-gradient(145deg,#f8f8f0,#fffdf7)}
.step-illustration{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.step-illustration b{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#e9f0e3;font-size:24px}
.step-illustration span{display:flex;flex-direction:column;gap:2px}
.step-illustration strong{font-size:12px}
.step-illustration small{color:var(--muted);font-size:10px}
.step-card h2{margin:0 0 7px;font-size:22px;line-height:1.35}
.step-card>p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}
.choice-list{display:grid;gap:9px;margin-top:20px}
.choice-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:53px;padding:11px 13px;text-align:left;border:1px solid var(--line);border-radius:11px;background:#fffefa;color:var(--ink);font-size:12px;line-height:1.5;transition:border-color .16s ease,background .16s ease}
.choice-btn:hover{border-color:#9ab39a;background:#f4f7ef}
.choice-btn .choice-no{display:grid;place-items:center;width:25px;height:25px;flex:0 0 25px;border-radius:7px;background:#f0f2e8;color:#52684f;font:800 10px ui-sans-serif,system-ui,sans-serif}
.choice-btn:disabled{cursor:default;opacity:.55}
.kitchen-title{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.kitchen-title .mini-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--soft);font-size:21px}
.kitchen-title h2{margin:0;font-size:17px}
.kitchen-title p{margin:3px 0 0;color:var(--muted);font-size:10px}
.kitchen-recipe{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;background:#f3f4eb}
.kitchen-dish{display:grid;place-items:center;width:54px;height:54px;border:4px solid #fffdf4;border-radius:50%;background:#e5eddc;font-size:30px;flex:0 0 auto}
.kitchen-recipe strong{display:block;font-size:13px}
.kitchen-recipe small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
.stat-list{display:grid;gap:0;margin:18px 0}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid #edf0e6;font-size:11px}
.stat-row span{color:var(--muted)}
.stat-row strong{font-weight:800;font-variant-numeric:tabular-nums}
.tip-box{margin-top:15px;padding:13px;border:1px dashed #d3dec9;border-radius:13px;background:#f8f8f1}
.tip-box strong{display:block;margin-bottom:5px;font-size:11px}
.tip-box p{margin:0;color:var(--muted);font-size:10px;line-height:1.8}
.result-panel{max-width:760px;margin:25px auto 0;padding:clamp(24px,5vw,50px);text-align:center;border:1px solid var(--line);border-radius:27px;background:var(--card);box-shadow:var(--shadow)}
.result-medal{display:grid;place-items:center;width:102px;height:102px;margin:0 auto 18px;border:1px solid #e7d8b3;border-radius:50%;background:radial-gradient(circle,#fff8df,#f2e2b9);box-shadow:0 0 0 9px #f5ecd67d;font-size:49px}
.result-panel h1{margin:0;font-size:clamp(28px,4.5vw,44px);line-height:1.2}
.result-panel>p{max-width:530px;margin:12px auto 19px;color:var(--muted);font-size:13px;line-height:1.9}
.result-score{display:flex;justify-content:center;align-items:center;gap:16px;margin:21px 0}
.result-score strong{color:var(--green);font:800 clamp(32px,6vw,48px)/1 ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.result-score span{color:var(--muted);font-size:10px;text-align:left}
.stars{margin:12px 0 24px;color:#d1a03b;font-size:30px;letter-spacing:7px}
.result-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.toast{position:fixed;left:50%;bottom:18px;z-index:10;max-width:calc(100% - 28px);padding:11px 15px;border-radius:12px;background:#243d2a;color:#fffdf4;font-size:12px;box-shadow:0 10px 25px #14291d25;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.show{transform:translate(-50%,0);opacity:1}
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:30px;padding:18px 3px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}
.site-footer strong{color:var(--green)}
[hidden]{display:none!important}
@keyframes floatSteam{0%,100%{transform:translateY(4px) rotate(-16deg);opacity:.35}50%{transform:translateY(-5px) rotate(8deg);opacity:.85}}
@media(max-width:850px){.hero{grid-template-columns:minmax(0,1fr) minmax(200px,.65fr);gap:12px;padding:28px}.hero-art{min-height:240px}.pot{transform:scale(.85) rotate(-5deg)}.game-layout{grid-template-columns:minmax(0,1fr) 240px}.recipe-grid{gap:11px}.recipe-art{min-height:130px}}

 {id:'chocolate',name:'চকলেট',emoji:'🍫',amount:'ভুল পছন্দ'},
 {id:'icecream',name:'আইসক্রিম',emoji:'🍦',amount:'ভুল পছন্দ'}
];
const state={phase:'home',recipeId:null,selected:new Set(),ingredientOptions:[],stepIndex:0,score:0,streak:0,timeLeft:90,feedback:'',feedbackType:'',hintUsed:false,best:0,expired:false};
const app=document.getElementById('app-main');
const topScore=document.getElementById('top-score');
const toast=document.getElementById('toast');
let timerId=null,toastId=null;
function getBest(){try{return Number(localStorage.getItem('rannar-menu-chef-best')||0)}catch(e){return 0}}
state.best=getBest();
function currentRecipe(){return RECIPES[state.recipeId]||null}
function escapeText(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function iconArrow(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>'}
function iconPlay(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 12 7-12 7V5Z" fill="currentColor" stroke="none"/></svg>'}
function iconChef(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12a4 4 0 1 1 1-7.87A5.1 5.1 0 0 1 17.4 6 3.5 3.5 0 0 1 18 13v5H6v-6Z"/><path d="M5 18h14M8 21h8"/></svg>'}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastId);toastId=setTimeout(function(){toast.classList.remove('show')},2300)}
function shuffle(items){const arr=items.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp}return arr}
function setFeedback(message,type){state.feedback=message;state.feedbackType=type||'';const box=document.getElementById('feedback');if(box){box.textContent=message;box.className='feedback'+(type?' '+type:'')}}
function stopTimer(){if(timerId!==null){clearInterval(timerId);timerId=null}}
function paintTimer(){const number=document.getElementById('timer-value');const track=document.getElementById('timer-fill');const box=document.getElementById('timer-box');if(number)number.textContent='0:'+String(Math.max(0,state.timeLeft)).padStart(2,'0');if(track)track.style.width=(Math.max(0,state.timeLeft)/90*100)+'%';if(box)box.classList.toggle('urgent',state.timeLeft<=15)}
function startTimer(){stopTimer();timerId=setInterval(function(){if(state.phase!=='ingredients'&&state.phase!=='cooking'){stopTimer();return}state.timeLeft=Math.max(0,state.timeLeft-1);paintTimer();if(state.timeLeft<=0){finishGame(state.score,true)}},1000)}
function chooseRecipe(id){if(!RECIPES[id])return;state.phase='ingredients';state.recipeId=id;state.selected=new Set();state.ingredientOptions=shuffle(RECIPES[id].ingredients.concat(shuffle(DISTRACTORS).slice(0,3)));state.stepIndex=0;state.score=0;state.streak=0;state.timeLeft=90;state.feedback='';state.feedbackType='';state.hintUsed=false;state.expired=false;render();startTimer();app.focus()}
function renderHome(){const cards=Object.values(RECIPES).map(function(recipe){return '<article class="recipe-card"><div class="recipe-art"><span class="recipe-chip">'+escapeText(recipe.label)+'</span><span class="dish" aria-hidden="true">'+recipe.emoji+'</span></div><div class="recipe-content"><h3>'+escapeText(recipe.title)+'</h3><p>'+escapeText(recipe.description)+'</p><div class="recipe-meta"><span><b>⏱</b> ৯০ সেকেন্ড</span><span><b>🥬</b> '+recipe.ingredients.length+' উপকরণ</span></div><button class="primary-btn" type="button" data-action="choose" data-recipe="'+recipe.id+'">এই পদ রান্না করি '+iconArrow()+'</button></div></article>'}).join('');
app.innerHTML='<section class="hero"><div><span class="eyebrow"><i class="eyebrow-dot"></i> COOK · LEARN · SCORE</span><h1>রান্না হোক<br><em>খেলার ছলে!</em></h1><p>উপকরণ চিনুন, সঠিক রান্নার ধাপ বেছে নিন আর ৯০ সেকেন্ডে তৈরি করুন আপনার পদ। যত দ্রুত ও নির্ভুল রান্না, তত বেশি স্কোর!</p><div class="hero-actions"><a class="primary-btn" href="#choose-recipe" onclick="document.getElementById(\'choose-recipe\').scrollIntoView({behavior:\'smooth\'});return false">খেলা শুরু করুন '+iconPlay()+'</a><a class="secondary-btn" href="./rannar-cooking-game.html" download="Rannar-Menu-Cooking-Game.html">অফলাইনে খেলতে ডাউনলোড ↓</a></div><div class="hero-mini-stats"><span><strong>০–৯০</strong> সেকেন্ডের চ্যালেঞ্জ</span><span><strong>৩টি</strong> রান্নার পদ</span><span><strong>∞</strong> বার খেলুন</span></div></div><div class="hero-art" aria-label="রান্নার হাঁড়ির চিত্র"><div class="art-orbit"></div><div class="steam" aria-hidden="true"><i></i><i></i><i></i></div><div class="pot"><span class="pot-face" aria-hidden="true">🍲</span></div><div class="art-label"><b>👨‍🍳</b><span>আজকের শেফ<br><strong>আপনিই!</strong></span></div></div></section><div id="choose-recipe" class="section-head"><div><h2>আজ কী রান্না করবেন?</h2><p>আপনার পছন্দের পদ বেছে নিয়ে চ্যালেঞ্জ শুরু করুন।</p></div></div><section class="recipe-grid" aria-label="রান্নার পদ">'+cards+'</section>';
}
function renderStageTrack(){let html='';for(let i=0;i<5;i++)html+='<span class="'+(i<state.stepIndex?'done':i===state.stepIndex?'active':'')+'"></span>';return html}
function renderIngredients(recipe){const tiles=state.ingredientOptions.map(function(item){const selected=state.selected.has(item.id);return '<button type="button" class="ingredient" data-action="ingredient" data-ingredient="'+item.id+'" aria-pressed="'+(selected?'true':'false')+'"><span class="checkmark">✓</span><span class="food-emoji" aria-hidden="true">'+item.emoji+'</span><strong>'+escapeText(item.name)+'</strong><small>'+escapeText(selected?'ঝুড়িতে যোগ হয়েছে':item.amount)+'</small></button>'}).join('');
return '<div class="game-layout"><section class="play-panel"><div class="play-topline"><div><span class="stage-kicker">STAGE 01 / 02 · INGREDIENTS</span><h1>সঠিক উপকরণ বেছে নিন</h1><p>'+escapeText(recipe.title)+' রান্নার জন্য প্রয়োজনীয় সব উপকরণে ট্যাপ করুন। ভুল জিনিস এড়িয়ে চলুন!</p></div><div class="timer-box" id="timer-box"><span>বাকি সময়</span><strong id="timer-value">1:30</strong></div></div><div class="timer-track"><span id="timer-fill"></span></div><div class="stage-track"><span class="active"></span><span></span></div><div class="ingredient-grid" aria-label="উপকরণের তালিকা">'+tiles+'</div><div class="action-row"><span class="selection-count">'+state.selected.size+' / '+recipe.ingredients.length+'টি নির্বাচিত</span><button class="primary-btn" type="button" data-action="check-ingredients">উপকরণ যাচাই করুন '+iconArrow()+'</button></div><div id="feedback" class="feedback '+state.feedbackType+'" aria-live="polite">'+escapeText(state.feedback)+'</div></section>'+renderKitchenPanel(recipe)+'</div>'}
function renderCooking(recipe){const step=recipe.steps[state.stepIndex];const shuffledChoices=shuffle(step.choices.map(function(choice,index){return {label:choice,isCorrect:index===step.correct}}));const choices=shuffledChoices.map(function(option,index){return '<button type="button" class="choice-btn" data-action="answer" data-is-correct="'+(option.isCorrect?'true':'false')+'"><span class="choice-no">'+String.fromCharCode(65+index)+'</span><span>'+escapeText(option.label)+'</span></button>'}).join('');
return '<div class="game-layout"><section class="play-panel"><div class="play-topline"><div><span class="stage-kicker">STAGE 02 / 02 · COOKING</span><h1>রান্নার সঠিক ধাপ বেছে নিন</h1><p>ধাপ '+(state.stepIndex+1)+' / '+recipe.steps.length+' · ভালোভাবে ভেবে সঠিক কাজটি নির্বাচন করুন।</p></div><div class="timer-box" id="timer-box"><span>বাকি সময়</span><strong id="timer-value">1:30</strong></div></div><div class="timer-track"><span id="timer-fill"></span></div><div class="stage-track">'+renderStageTrack()+'</div><div class="step-card"><div class="step-illustration"><b aria-hidden="true">'+step.emoji+'</b><span><strong>শেফের নির্দেশনা</strong><small>নির্ভুলতা বাড়ান, স্কোর জিতুন</small></span></div><h2>'+escapeText(step.title)+'</h2><p>'+escapeText(step.detail)+'</p><div class="choice-list">'+choices+'</div></div><div class="action-row"><span class="selection-count">কম্বো × '+Math.max(1,state.streak+1)+'</span><button class="secondary-btn" type="button" data-action="hint">ইঙ্গিত নিন · −৩ পয়েন্ট</button></div><div id="feedback" class="feedback '+state.feedbackType+'" aria-live="polite">'+escapeText(state.feedback)+'</div></section>'+renderKitchenPanel(recipe)+'</div>'}
function renderKitchenPanel(recipe){const stage=state.phase==='ingredients'?'উপকরণ সংগ্রহ':'রান্নার ধাপ '+(state.stepIndex+1)+' / '+recipe.steps.length;return '<aside class="kitchen-panel"><div class="kitchen-title"><span class="mini-icon">'+iconChef()+'</span><span><h2>আপনার রান্নাঘর</h2><p>চ্যালেঞ্জ কন্ট্রোল প্যানেল</p></span></div><div class="kitchen-recipe"><span class="kitchen-dish">'+recipe.emoji+'</span><span><strong>'+escapeText(recipe.title)+'</strong><small>'+escapeText(recipe.time)+'</small></span></div><div class="stat-list"><div class="stat-row"><span>বর্তমান স্কোর</span><strong id="live-score">'+state.score+'</strong></div><div class="stat-row"><span>সঠিক ধাপ</span><strong>'+Math.min(state.stepIndex,recipe.steps.length)+' / '+recipe.steps.length+'</strong></div><div class="stat-row"><span>সেরা রেকর্ড</span><strong>'+state.best+'</strong></div><div class="stat-row"><span>বর্তমান পর্যায়</span><strong>'+stage+'</strong></div></div><div class="tip-box"><strong>👨‍🍳 শেফের টিপস</strong><p>সঠিক উপকরণ বাছুন, ধাপের ক্রম বজায় রাখুন। ভুল উত্তরে ৫ পয়েন্ট কমবে ও ৩ সেকেন্ড সময় যাবে।</p></div><div class="action-row"><button class="secondary-btn" type="button" data-action="home">খেলা ছাড়ুন</button></div></aside>'}
function renderResult(){const recipe=currentRecipe();const stars=state.timeLeft>=40?3:state.timeLeft>=15?2:1;const starText=stars===3?'দারুণ! আপনি একদম পাকা শেফ।':stars===2?'চমৎকার রান্না! আরেকটু দ্রুত চেষ্টা করুন।':'আপনি পদটি শেষ করেছেন—আরেকবার খেলে স্কোর বাড়বে।';app.innerHTML='<section class="result-panel"><div class="result-medal" aria-hidden="true">'+(state.expired?'⏰':stars===3?'🏆':stars===2?'🥇':'🍲')+'</div><span class="stage-kicker">'+(state.expired?'TIME UP · CHEF CHALLENGE':'RECIPE COMPLETE · CHEF CHALLENGE')+'</span><h1>'+(state.expired?'সময় শেষ! আবার চেষ্টা করবেন?':'অভিনন্দন, শেফ!')+'</h1><p>'+(state.expired?'সময় শেষ হয়েছে। '+escapeText(recipe.title)+' রান্নার জন্য আবার চ্যালেঞ্জ নিন।':escapeText(recipe.title)+' তৈরি! '+starText)+'</p><div class="stars" aria-label="'+stars+'টি তারা">'+('★'.repeat(stars))+('<span style="color:#e7e7dc">'+('★'.repeat(3-stars))+'</span>')+'</div><div class="result-score"><strong>'+state.score+'</strong><span>আপনার স্কোর<br>সেরা রেকর্ড: '+state.best+'</span></div><div class="hero-mini-stats" style="justify-content:center;border-top:1px solid var(--line)"><span><strong>'+state.timeLeft+' সেকেন্ড</strong>সময় অবশিষ্ট</span><span><strong>'+recipe.steps.length+'</strong>রান্নার ধাপ</span><span><strong>'+stars+'/৩</strong>তারকা</span></div><div class="result-actions"><button type="button" class="primary-btn" data-action="retry">আবার এই পদ রান্না করুন ↻</button><button type="button" class="secondary-btn" data-action="home">অন্য পদ বেছে নিন</button><a class="secondary-btn" href="./rannar-cooking-game.html" download="Rannar-Menu-Cooking-Game.html">গেম ডাউনলোড ↓</a></div></section>'}
function render(){topScore.textContent='⭐ সেরা স্কোর '+state.best.toLocaleString('bn-BD');if(state.phase==='home'){renderHome();return}if(state.phase==='result'){renderResult();return}const recipe=currentRecipe();if(!recipe){state.phase='home';renderHome();return}app.innerHTML=state.phase==='ingredients'?renderIngredients(recipe):renderCooking(recipe);paintTimer()}
function checkIngredients(){const recipe=currentRecipe();if(!recipe)return;const valid=new Set(recipe.ingredients.map(function(item){return item.id}));const selected=Array.from(state.selected);const wrong=selected.filter(function(id){return !valid.has(id)});const missing=recipe.ingredients.filter(function(item){return !state.selected.has(item.id)});if(wrong.length){state.score=Math.max(0,state.score-wrong.length*4);state.timeLeft=Math.max(0,state.timeLeft-wrong.length*2);state.streak=0;state.feedback='ঝুড়িতে '+wrong.length+'টি ভুল উপকরণ আছে। সেগুলো সরিয়ে বাকি সঠিক উপকরণ বেছে নিন।';state.feedbackType='error';if(state.timeLeft===0){finishGame(state.score,true);return}}else if(missing.length){state.feedback='আরও '+missing.length+'টি উপকরণ বাকি। প্রয়োজনীয়গুলোতে ট্যাপ করে আবার যাচাই করুন।';state.feedbackType='';}else{state.score+=30;state.streak=1;state.phase='cooking';state.feedback='দারুণ! সব সঠিক উপকরণ পাওয়া গেছে। এবার রান্না শুরু।';state.feedbackType='success';render();return}render();const box=document.getElementById('feedback');if(box)box.focus()}
function answerStep(isCorrect){const recipe=currentRecipe();if(!recipe)return;const step=recipe.steps[state.stepIndex];if(isCorrect===true){const points=15+Math.min(state.streak*2,8);state.score+=points;state.streak++;state.stepIndex++;state.hintUsed=false;state.feedback='সঠিক! +'+points+' পয়েন্ট। পরের ধাপে এগিয়ে যান।';state.feedbackType='success';if(state.stepIndex>=recipe.steps.length){finishGame(state.score,false);return}render();}else{state.score=Math.max(0,state.score-5);state.timeLeft=Math.max(0,state.timeLeft-3);state.streak=0;state.feedback='এবার ঠিক হয়নি। ৫ পয়েন্ট ও ৩ সেকেন্ড কমেছে—আবার চেষ্টা করুন!';state.feedbackType='error';if(state.timeLeft===0){finishGame(state.score,true);return}render()}}
function finishGame(finalScore,expired){stopTimer();state.phase='result';state.score=finalScore;state.expired=Boolean(expired);state.best=Math.max(getBest(),finalScore);try{localStorage.setItem('rannar-menu-chef-best',String(state.best))}catch(e){}render();app.focus()}
function goHome(){stopTimer();state.phase='home';state.feedback='';state.feedbackType='';render();window.scrollTo({top:0,behavior:'smooth'})}
app.addEventListener('click',function(event){const button=event.target.closest('[data-action]');if(!button)return;const action=button.getAttribute('data-action');if(action==='choose'){chooseRecipe(button.getAttribute('data-recipe'));return}if(action==='home'){goHome();return}if(action==='retry'){chooseRecipe(state.recipeId);return}if(action==='ingredient'){const id=button.getAttribute('data-ingredient');if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);render();return}if(action==='check-ingredients'){checkIngredients();return}if(action==='answer'){answerStep(button.getAttribute('data-is-correct')==='true');return}if(action==='hint'){const recipe=currentRecipe();const step=recipe&&recipe.steps[state.stepIndex];if(!step)return;if(state.hintUsed){setFeedback('এই ধাপে ইঙ্গিত ইতিমধ্যে ব্যবহার করা হয়েছে: '+step.hint,'');return}state.score=Math.max(0,state.score-3);state.hintUsed=true;state.feedback='ইঙ্গিত: '+step.hint;state.feedbackType='';render();return}});
document.addEventListener('keydown',function(event){if(event.key==='Escape'&&(state.phase==='ingredients'||state.phase==='cooking')){goHome()}});
render();
})();
</script>
