name: Refresh cached news feeds

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-news-feed.mjs'
      - '.github/workflows/refresh-news.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and cache RSS news
        run: node scripts/refresh-news-feed.mjs
      - name: Ignore timestamp-only changes
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';

          const path = 'public/data/news-feed.json';
          const current = JSON.parse(await readFile(path, 'utf8'));
          let previous;
          try {
            previous = JSON.parse(execFileSync('git', ['show', 'HEAD:' + path], { encoding: 'utf8' }));
          } catch {
            console.log('No previous snapshot; publishing the first one.');
            process.exit(0);
          }

          const stableItem = (item) => ({
            id: item.id || item.link || '',
            title: item.title || '',
            link: item.link || '',
            source: item.source || '',
            publisherUrl: item.publisherUrl || '',
            publishedAt: item.publishedAt || '',
            summary: item.summary || '',
            articleUrl: item.articleUrl || '',
            image: item.image || '',
            imageFallback: item.imageFallback || '',
          });
          const normalize = (snapshot) => ({
            sponsors: Object.fromEntries(Object.entries(snapshot.sponsors || {}).map(([key, items]) => [
              key, (Array.isArray(items) ? items : []).map(stableItem),
            ])),
            categories: Object.fromEntries(Object.entries(snapshot.categories || {}).map(([key, items]) => [
              key, (Array.isArray(items) ? items : []).map(stableItem),
            ])),
          });

          if (JSON.stringify(normalize(current)) === JSON.stringify(normalize(previous))) {
            await writeFile(path, JSON.stringify(previous, null, 2) + '\\n');
            console.log('News and images unchanged; keeping the existing snapshot timestamp.');
          } else {
            console.log('News or image content changed; publishing the refreshed snapshot.');
          }
          NODE
      - name: Commit changed news snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news-feed.json
          if git diff --cached --quiet; then
            echo "News snapshot unchanged; no commit needed."
            exit 0
          fi
          git commit -m "Refresh cached news feed"
          git push origin HEAD:main
