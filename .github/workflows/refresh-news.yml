name: Refresh cached news feeds

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-news-feed.mjs'
      - '.github/workflows/refresh-news.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and cache RSS news
        run: node scripts/refresh-news-feed.mjs
      - name: Commit changed news snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news-feed.json
          if git diff --cached --quiet; then
            echo "News snapshot unchanged; no commit needed."
            exit 0
          fi
          git commit -m "Refresh cached news feed"
          git push origin HEAD:main
