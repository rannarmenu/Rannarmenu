name: Mira local-only smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mira-gemini-smoke.yml'
      - 'src/MiraChat.jsx'
      - 'src/lib/miraBrain.js'
      - 'src/lib/miraLanguage.js'
      - 'src/lib/recipeSearch.js'
      - 'supabase/functions/mira-chat/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-smoke:
    name: Verify Mira without a model API
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build website
        run: npm run build

      - name: Assert no model provider calls are wired into Mira
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE "functions\\.invoke\\(['\"]mira-chat|generativelanguage\\.googleapis\\.com|api\\.openai\\.com" src/MiraChat.jsx src/lib/miraBrain.js; then
            echo 'Unexpected AI-provider endpoint found in the Mira browser brain.'
            exit 1
          fi
          if grep -nE "generativelanguage\\.googleapis\\.com|api\\.openai\\.com|GEMINI_API_KEY" supabase/functions/mira-chat/index.ts; then
            echo 'Unexpected provider API dependency found in the deployed endpoint source.'
            exit 1
          fi
          echo 'Mira browser brain and endpoint contain no model-provider API calls.'
