name: Deploy Rannar Menu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh cached news feeds"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAGES: 'true'
      VITE_SUPABASE_URL: 'https://fiwqeivmieckzqglfrar.supabase.co'
      VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_WGA-bPS2B7hxXHBEVk0r0A_mQkJFhAx'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test recipe importer
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Support direct /admin navigation on GitHub Pages
        run: |
          mkdir -p dist/admin
          cp dist/index.html dist/admin/index.html
          cp dist/index.html dist/404.html
      - name: Verify Android APK is included in the website build
        shell: bash
        run: |
          set -euo pipefail
          apk="Rannar-Menu-Cooking-Game.apk"
          test -s "public/downloads/$apk"
          test -s "dist/downloads/$apk"
          cmp "public/downloads/$apk" "dist/downloads/$apk"
          size="$(stat -c '%s' "dist/downloads/$apk")"
          test "$size" -ge 500000
          echo "APK bundled successfully: $size bytes"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test live website, static news, and PWA assets
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          site_base="${SITE_URL%/}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --max-time 30 \
            "$site_base/?smoke=$GITHUB_RUN_ID" -o "$workdir/index.html"

          node --input-type=module - "$workdir/index.html" "$SITE_URL" "$workdir/asset-urls.txt" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const [htmlPath, adminPath, siteUrl, assetsPath] = process.argv.slice(2);
          const html = await readFile(htmlPath, 'utf8');
          const adminHtml = await readFile(adminPath, 'utf8');
          if (!/Rannar Menu/i.test(html)) throw new Error('Homepage title/brand is missing.');
          if (!/Rannar Menu/i.test(adminHtml)) throw new Error('Direct /admin route HTML is missing.');
          if (!adminHtml.includes('/Rannarmenu/assets/')) throw new Error('Direct /admin route does not reference the deployed bundle.');

          const assets = [...html.matchAll(/(?:src|href)=["']([^"']+\.(?:js|css)(?:\?[^"']*)?)["']/g)]
            .map((match) => match[1]);
          if (!assets.some((asset) => /\.js(?:\?|$)/i.test(asset))) throw new Error('Homepage JavaScript asset is missing.');
          if (!assets.some((asset) => /\.css(?:\?|$)/i.test(asset))) throw new Error('Homepage CSS asset is missing.');

          await writeFile(assetsPath, [...new Set(assets)].map((asset) => new URL(asset, siteUrl).href).join('\n') + '\n');
          NODE

          while IFS= read -r asset_url; do
            curl --fail --silent --show-error --location --retry 2 --max-time 30 "$asset_url" -o /dev/null
          done < "$workdir/asset-urls.txt"

          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "$site_base/data/news-feed.json?smoke=$GITHUB_RUN_ID" -o "$workdir/news-feed.json"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            "$site_base/manifest.webmanifest" -o "$workdir/manifest.webmanifest"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            "$site_base/rannar-menu-logo.svg" -o /dev/null
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            "$site_base/404.html" -o /dev/null
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "$site_base/admin/?smoke=$GITHUB_RUN_ID" -o "$workdir/admin.html"

          node --input-type=module - "$workdir/index.html" "$workdir/admin.html" "$SITE_URL" "$workdir/asset-urls.txt" <<'NODE'
          import { readFile } from 'node:fs/promises';

          const [newsPath, manifestPath] = process.argv.slice(2);
          const snapshot = JSON.parse(await readFile(newsPath, 'utf8'));
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));

          if (!snapshot.generatedAt || !snapshot.categories || !Array.isArray(snapshot.categories.food)
            || !Array.isArray(snapshot.categories.bangladesh) || !Array.isArray(snapshot.categories.international)) {
            throw new Error('News snapshot schema is invalid.');
          }
          if (!manifest.name || !Array.isArray(manifest.icons) || manifest.icons.length < 1) {
            throw new Error('PWA manifest is invalid.');
          }

          const count = Object.values(snapshot.categories)
            .filter(Array.isArray)
            .reduce((total, entries) => total + entries.length, 0);
          console.log(`Website smoke test passed: homepage, direct /admin route, JS/CSS assets, news snapshot (${count} categorized items), PWA manifest, logo, and 404 fallback.`);
          NODE
      - name: Verify live Android APK download
        shell: bash
        run: |
          set -euo pipefail
          url="https://rannarmenu.github.io/Rannarmenu/downloads/Rannar-Menu-Cooking-Game.apk"
          for attempt in {1..8}; do
            if curl --fail --silent --show-error --location --max-time 30 "$url?verify=$GITHUB_RUN_ID" -o /tmp/Rannar-Menu-Cooking-Game.apk; then
              break
            fi
            if [[ "$attempt" -eq 8 ]]; then
              echo "::error::The live APK URL did not return a successful download."
              exit 1
            fi
            sleep 5
          done
          size="$(stat -c '%s' /tmp/Rannar-Menu-Cooking-Game.apk)"
          test "$size" -ge 500000
          magic="$(od -An -tx1 -N4 /tmp/Rannar-Menu-Cooking-Game.apk | tr -d ' \n')"
          test "$magic" = "504b0304"
          echo "Live APK download verified: $size bytes; ZIP/APK signature OK."
