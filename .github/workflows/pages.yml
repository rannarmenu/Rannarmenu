name: Deploy Rannar Menu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAGES: 'true'
      VITE_SUPABASE_URL: 'https://fiwqeivmieckzqglfrar.supabase.co'
      VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_WGA-bPS2B7hxXHBEVk0r0A_mQkJFhAx'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test recipe importer
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Support direct /admin navigation on GitHub Pages
        run: cp dist/index.html dist/404.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
