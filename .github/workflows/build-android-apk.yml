name: Build Rannar Menu Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare public download file
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Rannar-Menu.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rannar-Menu-Android-APK
          path: android-app/app/build/outputs/apk/debug/Rannar-Menu.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Rannar Menu Android APK
          body: |
            Installable Android WebView build for Rannar Menu.

            This is a debug-signed APK for testing and direct installation, not a Play Store release. Android may ask you to allow installation from your browser or file manager.
          target_commitish: main
          files: android-app/app/build/outputs/apk/debug/Rannar-Menu.apk
          overwrite_files: true
          make_latest: false
