name: Build Rannar Menu Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with stable signing when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(awk '/versionCode[[:space:]]+[0-9]+/ { print $2; exit }' app/build.gradle)"
          if [[ -z "$VERSION_CODE" ]]; then
            echo "::error::Could not read versionCode from app/build.gradle"
            exit 1
          fi
          mkdir -p build/public

          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            if [[ -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "::error::All four Android signing secrets must be set together."
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-signing-key.jks
            export ANDROID_KEYSTORE_PATH="$PWD/app/release-signing-key.jks"
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk build/public/Rannar-Menu.apk
            rm -f app/release-signing-key.jks
            echo "Built APK with the persistent release signing key."
          else
            if [[ "$VERSION_CODE" -ge 3 ]]; then
              echo "::error::A persistent signing key is required from versionCode 3 onward. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository Actions secrets before publishing another version."
              exit 1
            fi
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk build/public/Rannar-Menu.apk
            echo "::warning::This bootstrap APK is debug-signed. Configure a persistent signing key before future releases."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rannar-Menu-Android-APK
          path: android-app/build/public/Rannar-Menu.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Rannar Menu Android APK
          body: |
            Rannar Menu Android app release.

            A persistent Android signing key is used when repository signing secrets are configured. The initial bootstrap APK is debug-signed and is not a Google Play production release. Android may ask to allow installation from your browser or file manager.
          target_commitish: main
          files: android-app/build/public/Rannar-Menu.apk
          overwrite_files: true
          make_latest: false

      - name: Update the required app version on the website
        working-directory: .
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          gradle = Path("android-app/app/build.gradle").read_text(encoding="utf-8")
          code_match = re.search(r"versionCode\s+(\d+)", gradle)
          name_match = re.search(r"versionName\s+['\"]([^'\"]+)['\"]", gradle)
          if not code_match or not name_match:
              raise SystemExit("Could not read versionCode/versionName from app/build.gradle")

          version_code = int(code_match.group(1))
          version_name = name_match.group(1)
          path = Path("public/app-update.json")
          info = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          info.update({
              "latestVersion": version_name,
              "latestVersionCode": version_code,
              "minimumVersionCode": version_code,
              "apkUrl": "https://github.com/rannarmenu/Rannarmenu/releases/download/android-latest/Rannar-Menu.apk",
              "forceUpdate": True,
              "message": "Rannar Menu ব্যবহার চালিয়ে যেতে নতুন সংস্করণ ইনস্টল করুন।"
          })
          path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Website will require Rannar Menu {version_name} (versionCode {version_code}).")
          PY

      - name: Commit app version metadata
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update minimum Android app version"
          file_pattern: public/app-update.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Redeploy website with the new version gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-updated-website.yml --repo "$GITHUB_REPOSITORY" --ref main
